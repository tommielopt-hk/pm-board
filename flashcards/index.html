<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Grok Bot — 25 Concepts · Mr Lee</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-elev: #171a21;
    --bg-card: #1c212b;
    --bg-card-back: #1a2330;
    --border: #2a3140;
    --text: #e8ecf4;
    --muted: #9aa3b5;
    --faint: #6b7385;
    --accent: #7eb8ff;
    --accent-soft: rgba(126, 184, 255, 0.14);
    --accent-strong: #5a9eef;
    --good: #6bcf8e;
    --good-soft: rgba(107, 207, 142, 0.15);
    --warn: #f0b35a;
    --warn-soft: rgba(240, 179, 90, 0.14);
    --radius: 18px;
    --shadow: 0 18px 50px rgba(0,0,0,0.45);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: radial-gradient(1200px 600px at 50% -10%, #1a2740 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    width: min(720px, 100%);
    margin: 0 auto;
    padding: 24px 18px 32px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  header {
    text-align: center;
    padding: 8px 4px 0;
  }
  header h1 {
    font-size: clamp(1.35rem, 4vw, 1.75rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }
  header .sub {
    margin-top: 6px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    border: 1px solid var(--border);
    background: var(--bg-elev);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .chip:hover { color: var(--text); border-color: #3a4558; }
  .chip.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: rgba(126,184,255,0.45);
  }

  .toggles {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--bg-elev);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
  }
  .toggle.on {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: rgba(126,184,255,0.45);
  }
  .toggle .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor; opacity: 0.5;
  }
  .toggle.on .dot { opacity: 1; }

  .progress-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .progress-meta strong { color: var(--text); font-size: 1rem; }
  .bar {
    height: 4px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar > span {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, var(--accent-strong), var(--accent));
    width: 0%;
    transition: width .25s ease;
    border-radius: 999px;
  }

  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 320px;
    perspective: 1200px;
  }

  .card {
    position: relative;
    width: 100%;
    min-height: 340px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(.2,.8,.2,1);
    outline: none;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .card.flipped { transform: rotateY(180deg); }
  .card:focus-visible { box-shadow: var(--shadow), 0 0 0 3px rgba(126,184,255,0.45); }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 28px 28px 24px;
    display: flex;
    flex-direction: column;
    background: linear-gradient(165deg, #222836 0%, var(--bg-card) 55%);
  }
  .face.back {
    transform: rotateY(180deg);
    background: linear-gradient(165deg, #1e2a3a 0%, var(--bg-card-back) 60%);
  }

  .badge {
    display: inline-flex;
    align-self: flex-start;
    align-items: center;
    gap: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid rgba(126,184,255,0.28);
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .badge.bonus {
    background: var(--warn-soft);
    color: var(--warn);
    border-color: rgba(240,179,90,0.35);
  }

  .concept {
    margin-top: 22px;
    font-size: clamp(1.55rem, 5vw, 2.05rem);
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.2;
    flex: 1;
    display: flex;
    align-items: center;
  }

  .hint-flip {
    margin-top: auto;
    color: var(--faint);
    font-size: 0.8rem;
    text-align: center;
    padding-top: 16px;
  }

  .summary {
    margin-top: 18px;
    font-size: clamp(1.05rem, 3.2vw, 1.25rem);
    line-height: 1.45;
    font-weight: 500;
    flex: 1;
  }

  .meta-block {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .meta-row {
    font-size: 0.82rem;
    line-height: 1.4;
    color: var(--muted);
  }
  .meta-row strong {
    display: block;
    color: var(--accent);
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .meta-row.map strong { color: var(--good); }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .nav-row {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 10px;
    align-items: center;
  }

  button.btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--bg-elev);
    color: var(--text);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .1s;
    font-family: inherit;
  }
  button.btn:hover { background: #222836; border-color: #3a4558; }
  button.btn:active { transform: scale(0.98); }
  button.btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.btn.primary {
    background: var(--accent-soft);
    border-color: rgba(126,184,255,0.4);
    color: var(--accent);
  }
  button.btn.know {
    background: var(--good-soft);
    border-color: rgba(107,207,142,0.4);
    color: var(--good);
  }
  button.btn.learn {
    background: var(--warn-soft);
    border-color: rgba(240,179,90,0.4);
    color: var(--warn);
  }
  button.btn.ghost {
    background: transparent;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 8px 12px;
  }
  .flip-mid {
    min-width: 88px;
    text-align: center;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 0.8rem;
    color: var(--faint);
  }
  .stats span b { color: var(--muted); font-weight: 600; }

  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    background: var(--bg-elev);
  }
  .empty h2 { color: var(--text); margin-bottom: 8px; font-size: 1.25rem; }
  .empty p { margin-bottom: 16px; line-height: 1.45; }

  footer {
    text-align: center;
    color: var(--faint);
    font-size: 0.72rem;
    line-height: 1.45;
    padding: 4px 8px 8px;
  }

  .keys {
    text-align: center;
    color: var(--faint);
    font-size: 0.72rem;
  }
  kbd {
    display: inline-block;
    border: 1px solid var(--border);
    background: var(--bg-elev);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 0.68rem;
    font-family: inherit;
    color: var(--muted);
  }

  @media (max-width: 520px) {
    .app { padding: 16px 12px 24px; gap: 14px; }
    .card { min-height: 300px; }
    .face { padding: 22px 18px 18px; }
    .controls { gap: 8px; }
    .nav-row { grid-template-columns: 1fr 1fr; }
    .flip-mid { grid-column: 1 / -1; order: -1; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Grok Bot — 25 Concepts</h1>
    <div class="sub">Mr Lee · Preface Track A A1</div>
  </header>

  <div class="toolbar">
    <div class="chips" id="chips" role="tablist" aria-label="Filter by part"></div>
    <div class="toggles">
      <button type="button" class="toggle" id="shuffleToggle" aria-pressed="false" title="Shuffle deck">
        <span class="dot"></span> Shuffle
      </button>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-meta">
      <span><strong id="posLabel">1 / 26</strong></span>
      <span id="knownLabel">0 known</span>
    </div>
    <div class="bar" aria-hidden="true"><span id="barFill"></span></div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="controls" id="controls">
    <div class="nav-row">
      <button type="button" class="btn" id="prevBtn" aria-label="Previous card">← Prev</button>
      <button type="button" class="btn primary flip-mid" id="flipBtn" aria-label="Flip card">Flip</button>
      <button type="button" class="btn" id="nextBtn" aria-label="Next card">Next →</button>
    </div>
    <button type="button" class="btn know" id="knowBtn">Know ✓</button>
    <button type="button" class="btn learn" id="learnBtn">Still learning</button>
    <button type="button" class="btn ghost" id="restartBtn" style="grid-column:1/-1">Restart deck</button>
  </div>

  <div class="stats">
    <span>In deck: <b id="deckCount">26</b></span>
    <span>Known: <b id="knownCount">0</b></span>
    <span>Filter: <b id="filterLabel">All</b></span>
  </div>

  <p class="keys">
    <kbd>Space</kbd> flip · <kbd>←</kbd> <kbd>→</kbd> navigate · <kbd>Esc</kbd> front · <kbd>K</kbd> know · <kbd>L</kbd> still learning
  </p>

  <footer>
    Source: Nate Herk · Every Grok Bot Concept Explained · mapped to Track A A1 + David Ng notes
  </footer>
</div>

<script>
const CARDS = [
  {

    summary: "One named bot with a job title and description; each chat is its own specialist.",
    tip: "Start by naming one bot and one job — not a Swiss-army chatbot.",
    map: "A1: one assistant / one role"
  },
  {
    id: 2, part: "Part 1", partFull: "Part 1 — What the bot is", concept: "Bot descriptions",
    summary: "Clear descriptions let bots know when to take work or hand off to a teammate.",
    tip: "Write a 1–2 sentence job description before anything else.",
    map: "A1 RTRF / Role clarity; David: ecosystem map"
  },
  {
    id: 3, part: "Part 1", partFull: "Part 1 — What the bot is", concept: "Bot templates",
    summary: "Import or share bots (skills/memories/structure); reconnect your own accounts.",

    map: "A5 Plugins analogy (install a pack)"

  {

  },
  {
    id: 5, part: "Part 1", partFull: "Part 1 — What the bot is", concept: "Compaction",
    summary: "Each bot auto-summarises old chat so the context window does not rot; you do not control the moment.",
    tip: "Trust recent work + saved memories; restate critical constraints if needed.",

  {
    id: 6, part: "Part 2", partFull: "Part 2 — Where it works", concept: "Agent computer",

    tip: "Demo opening the bot’s computer so it feels real.",
    map: "CoWork / agent computer"
  },
  {
    id: 7, part: "Part 2", partFull: "Part 2 — Where it works", concept: "Browser",
    summary: "Bot browser with saved logins for sites you signed into.",
    tip: "Log in once; bot reuses the session for that site.",
    map: "A4 Connectors + browser work"
  },
  {
    id: 8, part: "Part 2", partFull: "Part 2 — Where it works", concept: "File explorer (shared workspace)",
    summary: "All bots see the same shared workspace files on the agent computer.",
    tip: "Put shared briefs in one workspace folder.",
    map: "Projects / shared knowledge"
  },
  {
    id: 9, part: "Part 2", partFull: "Part 2 — Where it works", concept: "Terminal",
    summary: "Bots can run shell commands and scripts like a normal computer.",
    tip: "Use for installs/scripts — not for everyday chat.",
    map: "Code / build surface"
  },
  {
    id: 10, part: "Part 2", partFull: "Part 2 — Where it works", concept: "Local file access",
    summary: "With approval; bots can read/rename/move files on your own machine.",
    tip: "Always approve local file moves consciously.",
    map: "Approvals / human control"
  },
  {
    id: 11, part: "Part 3", partFull: "Part 3 — Abilities", concept: "Plugins",
    summary: "Connect Slack/Gmail/Docs/etc. by adding a plugin and signing in; multi-account OK.",
    tip: "Connect one work tool first (e.g. Gmail or Drive).",
    map: "A5 Plugins; David: Plugins"
  },
  {
    id: 12, part: "Part 3", partFull: "Part 3 — Abilities", concept: "Skills",
    summary: "Reusable recipes (when to use / steps / failure handling); editable and improvable with feedback.",
    tip: "Turn one recurring task into a Skill after the session.",
    map: "A2 Skills; David: Skills"
  },
  {
    id: 13, part: "Part 3", partFull: "Part 3 — Abilities", concept: "Teach a task",
    summary: "Record yourself in the browser; bot watches and turns the demo into a Skill.",
    tip: "Great for clicky workflows you do weekly.",
    map: "A2 Skills authoring"
  },
  {
    id: 14, part: "Part 3", partFull: "Part 3 — Abilities", concept: "Routines",
    summary: "Schedule or interval triggers that can run a Skill automatically.",
    tip: "Pick one daily/weekly routine — not ten.",
    map: "David: Routines layer"
  },
  {
    id: 15, part: "Part 3", partFull: "Part 3 — Abilities", concept: "Webhooks / event triggers",
    summary: "Event doorbells (form/Slack/email/CRM) wake a bot with a payload.",
    tip: "Pair with one real inbound event later.",
    map: "A4/A6 automation triggers"
  },
  {
    id: 16, part: "Part 4", partFull: "Part 4 — Bots together", concept: "Group chats",
    summary: "Multi-bot rooms where specialists discuss and you oversee.",
    tip: "Use for planning with 2–3 bots max at first.",
    map: "Team / CoWork collaboration"
  },
  {
    id: 17, part: "Part 4", partFull: "Part 4 — Bots together", concept: "Mentions",
    summary: "@Name steers a teammate; good descriptions also let bots self-delegate.",
    tip: "Mention once to show control; then let descriptions do work.",
    map: "Delegation"
  },
  {
    id: 18, part: "Part 4", partFull: "Part 4 — Bots together", concept: "Handoffs",
    summary: "Bots assign work to other bots; you can open their private handoff threads.",
    tip: "Show visibility into a handoff conversation.",
    map: "Org-chart of bots"
  },
  {
    id: 19, part: "Part 4", partFull: "Part 4 — Bots together", concept: "Replies",
    summary: "Reply-to a specific message to pin context (like Slack).",
    tip: "Use when several threads are active in one chat.",
    map: "Context control"
  },
  {
    id: 20, part: "Part 5", partFull: "Part 5 — Control & monitor", concept: "Approvals",
    summary: "Pause for allow-once / always-allow on computer and risky actions.",
    tip: "Default: ask before local/computer actions.",
    map: "Human-in-the-loop"
  },
  {
    id: 21, part: "Part 5", partFull: "Part 5 — Control & monitor", concept: "Human takeover",
    summary: "Bot stops for sign-in/sensitive steps; enter secrets on screen not in chat.",
    tip: "Never paste passwords into the chat.",
    map: "Security hygiene"
  },
  {
    id: 22, part: "Part 5", partFull: "Part 5 — Control & monitor", concept: "Weekly usage",
    summary: "Subscription usage resets weekly; group chats cost more than 1:1.",
    tip: "Watch the meter when running multi-bot rooms.",
    map: "Ops awareness"
  },
  {
    id: 23, part: "Part 5", partFull: "Part 5 — Control & monitor", concept: "Run history",
    summary: "See that routines/webhooks fired (success/fail); limited drill-down today.",
    tip: "Check run history after first routine.",
    map: "Ops / logging"
  },
  {
    id: 24, part: "Part 5", partFull: "Part 5 — Control & monitor", concept: "Notifications",
    summary: "Per-bot finish/needs-input alerts; desktop + phone stay synced.",
    tip: "Enable notifications only on primary bots.",
    map: "Ops"
  },
  {
    id: 25, part: "Part 5", partFull: "Part 5 — Control & monitor", concept: "Managing bots",
    summary: "Pin / move sections / hide / delete / share template / duplicate (clears chat history) / copy conversation ID.",
    tip: "Duplicate to reset chat without losing skills/routines.",
    map: "Bot hygiene"
  },
  {
    id: 26, part: "Bonus", partFull: "Extra", concept: "Agent logging",
    summary: "Log projects/runs to Sheet/ClickUp/DB so autonomous work stays visible.",
    tip: "Agree one logging place before scaling bots.",
    map: "Visibility / control"
  }
];

const STORAGE_KEY = "mrLeeGrokBotFlashcards_v1";
const PARTS = ["All", "Part 1", "Part 2", "Part 3", "Part 4", "Part 5", "Bonus"];

const state = {
  filter: "All",
  shuffle: false,
  order: CARDS.map(c => c.id),
  index: 0,
  flipped: false,
  known: new Set()
};

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (Array.isArray(data.known)) state.known = new Set(data.known);
    if (typeof data.shuffle === "boolean") state.shuffle = data.shuffle;
    if (data.filter && PARTS.includes(data.filter)) state.filter = data.filter;
  } catch (_) {}
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      known: [...state.known],
      shuffle: state.shuffle,
      filter: state.filter
    }));
  } catch (_) {}
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function rebuildOrder(keepCurrentId) {
  let ids = CARDS
    .filter(c => state.filter === "All" || c.part === state.filter)
    .filter(c => !state.known.has(c.id))
    .map(c => c.id);

  if (state.shuffle) ids = shuffleArray(ids);
  else ids.sort((a, b) => a - b);

  state.order = ids;
  if (keepCurrentId && ids.includes(keepCurrentId)) {
    state.index = ids.indexOf(keepCurrentId);
  } else {
    state.index = 0;
  }
  if (state.index >= ids.length) state.index = Math.max(0, ids.length - 1);
  state.flipped = false;
}

function currentCard() {
  if (!state.order.length) return null;
  const id = state.order[state.index];
  return CARDS.find(c => c.id === id) || null;
}

function renderChips() {
  const el = document.getElementById("chips");
  el.innerHTML = PARTS.map(p => {
    const active = p === state.filter ? " active" : "";
    return `<button type="button" class="chip${active}" data-part="${p}" role="tab" aria-selected="${p === state.filter}">${p}</button>`;
  }).join("");
  el.querySelectorAll(".chip").forEach(btn => {
    btn.addEventListener("click", () => {
      state.filter = btn.dataset.part;
      save();
      rebuildOrder();
      render();
    });
  });
}

function renderCard(card) {
  const stage = document.getElementById("stage");
  if (!card) {
    const knownInFilter = CARDS.filter(c =>
      (state.filter === "All" || c.part === state.filter) && state.known.has(c.id)
    ).length;
    stage.innerHTML = `
      <div class="empty">
        <h2>${knownInFilter ? "Deck complete 🎉" : "No cards in this filter"}</h2>
        <p>${knownInFilter
          ? "You’ve marked every card in this filter as known. Restart to practice again, or switch filters."
          : "Try another Part filter, or restart the deck."}</p>
        <button type="button" class="btn primary" id="emptyRestart">Restart deck</button>
      </div>`;
    document.getElementById("emptyRestart")?.addEventListener("click", restartDeck);
    return;
  }

  const badgeClass = card.part === "Bonus" ? "badge bonus" : "badge";
  const flippedClass = state.flipped ? " flipped" : "";
  stage.innerHTML = `
    <div class="card${flippedClass}" id="flashcard" tabindex="0" role="button" aria-label="Flashcard: ${card.concept}. Click or press Space to flip.">
      <div class="face front">
        <span class="${badgeClass}">${card.partFull}</span>
        <div class="concept">${escapeHtml(card.concept)}</div>
        <div class="hint-flip">Tap or press Space to flip</div>
      </div>
      <div class="face back">
        <span class="${badgeClass}">${card.partFull}</span>
        <div class="summary">${escapeHtml(card.summary)}</div>
        <div class="meta-block">
          <div class="meta-row"><strong>Teach tip</strong>${escapeHtml(card.tip)}</div>
          <div class="meta-row map"><strong>Track A / David</strong>${escapeHtml(card.map)}</div>
        </div>
      </div>
    </div>`;

  const cardEl = document.getElementById("flashcard");
  cardEl.addEventListener("click", (e) => {
    e.preventDefault();
    flip();
  });
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function updateMeta() {
  const totalInFilter = CARDS.filter(c => state.filter === "All" || c.part === state.filter).length;
  const knownInFilter = CARDS.filter(c =>
    (state.filter === "All" || c.part === state.filter) && state.known.has(c.id)
  ).length;
  const deckLen = state.order.length;
  const pos = deckLen ? state.index + 1 : 0;

  document.getElementById("posLabel").textContent = `${pos} / ${totalInFilter || deckLen || 0}`;
  document.getElementById("knownLabel").textContent = `${knownInFilter} known · ${deckLen} left`;
  const pct = totalInFilter ? ((knownInFilter / totalInFilter) * 100) : 0;
  document.getElementById("barFill").style.width = `${pct}%`;

  document.getElementById("deckCount").textContent = String(deckLen);
  document.getElementById("knownCount").textContent = String(state.known.size);
  document.getElementById("filterLabel").textContent = state.filter;

  const shuffleBtn = document.getElementById("shuffleToggle");
  shuffleBtn.classList.toggle("on", state.shuffle);
  shuffleBtn.setAttribute("aria-pressed", String(state.shuffle));

  document.getElementById("prevBtn").disabled = deckLen === 0 || state.index <= 0;
  document.getElementById("nextBtn").disabled = deckLen === 0 || state.index >= deckLen - 1;
  document.getElementById("flipBtn").disabled = deckLen === 0;
  document.getElementById("knowBtn").disabled = deckLen === 0;
  document.getElementById("learnBtn").disabled = deckLen === 0;
}

function render() {
  renderChips();
  renderCard(currentCard());
  updateMeta();
}

function flip() {
  if (!state.order.length) return;
  state.flipped = !state.flipped;
  const el = document.getElementById("flashcard");
  if (el) el.classList.toggle("flipped", state.flipped);
}

function go(delta) {
  if (!state.order.length) return;
  const next = state.index + delta;
  if (next < 0 || next >= state.order.length) return;
  state.index = next;
  state.flipped = false;
  render();
}

function markKnown() {
  const card = currentCard();
  if (!card) return;
  state.known.add(card.id);
  save();
  const nextId = state.order[state.index + 1] || state.order[state.index - 1] || null;
  rebuildOrder(null);
  // Prefer advancing; if deck emptied, stay empty
  if (nextId && state.order.includes(nextId)) {
    state.index = state.order.indexOf(nextId);
  }
  render();
}

function stillLearning() {
  // Keep in deck; if shuffle, move to end for spaced practice feel
  if (!state.order.length) return;
  const id = state.order[state.index];
  if (state.order.length > 1) {
    state.order.splice(state.index, 1);
    state.order.push(id);
    if (state.index >= state.order.length) state.index = 0;
  }
  state.flipped = false;
  render();
}

function restartDeck() {
  state.known.clear();
  state.flipped = false;
  state.index = 0;
  save();
  rebuildOrder();
  render();
}

function bind() {
  document.getElementById("prevBtn").addEventListener("click", () => go(-1));
  document.getElementById("nextBtn").addEventListener("click", () => go(1));
  document.getElementById("flipBtn").addEventListener("click", flip);
  document.getElementById("knowBtn").addEventListener("click", markKnown);
  document.getElementById("learnBtn").addEventListener("click", stillLearning);
  document.getElementById("restartBtn").addEventListener("click", restartDeck);
  document.getElementById("shuffleToggle").addEventListener("click", () => {
    state.shuffle = !state.shuffle;
    save();
    const cur = currentCard();
    rebuildOrder(cur ? cur.id : null);
    render();
  });

  document.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === " " || e.code === "Space") {
      e.preventDefault();
      flip();
    } else if (e.key === "ArrowRight") {
      e.preventDefault();
      go(1);
    } else if (e.key === "ArrowLeft") {
      e.preventDefault();
      go(-1);
    } else if (e.key === "Escape") {
      state.flipped = false;
      const el = document.getElementById("flashcard");
      if (el) el.classList.remove("flipped");
    } else if (e.key === "k" || e.key === "K") {
      markKnown();
    } else if (e.key === "l" || e.key === "L") {
      stillLearning();
    }
  });
}

load();
rebuildOrder();
bind();
render();
</script>
</body>
</html>
